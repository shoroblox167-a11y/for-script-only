name: Vendor Exo UI

on:
  push:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor Exo UI
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/9kkinc-sudo/ui_lib/main/source.lua -o src/Fable_ExoUI.lua
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Fable_ExoUI.lua
          if git diff --cached --quiet; then
            echo 'Fable_ExoUI.lua already up to date.'
            exit 0
          fi
          git commit -m 'Vendor exact Exo UI source'
          git push
